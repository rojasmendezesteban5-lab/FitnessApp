<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Agregar cliente | FitnessApp</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f8;
            color: #1f2937;
        }

        .navbar {
            background: #111827;
            color: white;
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .logo span {
            color: #22c55e;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            background: #374151;
            padding: 9px 16px;
            border-radius: 7px;
            font-size: 14px;
        }

        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .header {
            margin-bottom: 25px;
        }

        .header h1 {
            font-size: 30px;
            margin-bottom: 8px;
        }

        .header p {
            color: #6b7280;
        }

        .form-box {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.06);
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .full {
            grid-column: 1 / -1;
        }

        label {
            font-weight: bold;
            margin-bottom: 7px;
            font-size: 14px;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        input:focus,
        textarea:focus {
            border-color: #22c55e;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        .buttons {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 25px;
        }

        .button {
            padding: 12px 20px;
            border-radius: 8px;
            text-decoration: none;
            border: none;
            cursor: pointer;
            font-size: 15px;
        }

        .cancel {
            background: #e5e7eb;
            color: #111827;
        }

        .save {
            background: #22c55e;
            color: white;
            font-weight: bold;
        }

        .save:hover {
            background: #16a34a;
        }

        @media (max-width: 650px) {

            .navbar {
                padding: 15px 20px;
            }

            .container {
                margin: 25px auto;
            }

            .form-box {
                padding: 20px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .full {
                grid-column: auto;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">

        <div class="logo">
            Fitness<span>App</span>
        </div>

        <a href="/clientes/">
            Volver a clientes
        </a>

    </nav>


    <main class="container">

        <div class="header">

            <h1>Agregar cliente</h1>

            <p>
                Registra un nuevo cliente en FitnessApp.
            </p>

        </div>


        <section class="form-box">

            <form method="POST">

                {% csrf_token %}

                <div class="form-grid">

                    <div class="form-group full">

                        <label for="nombre">
                            Nombre completo
                        </label>

                        <input
                            type="text"
                            id="nombre"
                            name="nombre"
                            placeholder="Ejemplo: María Rodríguez"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="correo">
                            Correo electrónico
                        </label>

                        <input
                            type="email"
                            id="correo"
                            name="correo"
                            placeholder="correo@ejemplo.com"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="telefono">
                            Teléfono
                        </label>

                        <input
                            type="text"
                            id="telefono"
                            name="telefono"
                            placeholder="8888-8888"
                        >

                    </div>


                    <div class="form-group">

                        <label for="edad">
                            Edad
                        </label>

                        <input
                            type="number"
                            id="edad"
                            name="edad"
                            min="1"
                            max="120"
                            placeholder="25"
                        >

                    </div>


                    <div class="form-group">

                        <label for="peso">
                            Peso (kg)
                        </label>

                        <input
                            type="number"
                            id="peso"
                            name="peso"
                            step="0.01"
                            min="0"
                            placeholder="70.00"
                        >

                    </div>


                    <div class="form-group">

                        <label for="altura">
                            Altura (metros)
                        </label>

                        <input
                            type="number"
                            id="altura"
                            name="altura"
                            step="0.01"
                            min="0"
                            placeholder="1.75"
                        >

                    </div>


                    <div class="form-group">

                        <label for="objetivo">
                            Objetivo
                        </label>

                        <input
                            type="text"
                            id="objetivo"
                            name="objetivo"
                            placeholder="Ejemplo: Ganar masa muscular"
                        >

                    </div>


                    <div class="form-group full">

                        <label for="notas">
                            Notas
                        </label>

                        <textarea
                            id="notas"
                            name="notas"
                            placeholder="Información adicional del cliente..."
                        ></textarea>

                    </div>

                </div>


                <div class="buttons">

                    <a
                        href="/clientes/"
                        class="button cancel"
                    >
                        Cancelar
                    </a>

                    <button
                        type="submit"
                        class="button save"
                    >
                        Guardar cliente
                    </button>

                </div>

            </form>

        </section>

    </main>

</body>
</html>
