<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}FitnessApp{% endblock %}</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #111827;
        }

        header {
            background: #111827;
            color: white;
            padding: 18px 35px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .logo {
            color: white;
            text-decoration: none;
            font-size: 22px;
            font-weight: bold;
        }

        nav {
            display: flex;
            align-items: center;
            gap: 22px;
            flex-wrap: wrap;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            white-space: nowrap;
        }

        nav a:hover {
            opacity: 0.8;
        }

        .logout {
            color: #fca5a5 !important;
        }

        main {
            max-width: 1100px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .volver {
            display: inline-block;
            margin-bottom: 20px;
            padding: 9px 16px;
            background: #111827;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
        }

        .volver:hover {
            opacity: 0.85;
        }

        footer {
            text-align: center;
            color: #64748b;
            font-size: 13px;
            padding: 30px 20px;
        }

        @media (max-width: 700px) {
            header {
                padding: 15px 18px;
                flex-direction: column;
                align-items: flex-start;
            }

            nav {
                gap: 12px;
            }
        }
    </style>

    {% block extra_css %}{% endblock %}
</head>

<body>

<header>

    <a href="/" class="logo">🏋️ FITNESS</a>

    {% if user.is_authenticated and not user.is_staff %}

    <nav>

        <a href="/">🏠 Inicio</a>

        <a href="/perfil/">👤 Mi perfil</a>

        <a href="/rutina/">🎯 Mi rutina</a>

        <a href="/progreso/">📊 Mi progreso</a>

        <a href="/logout/" class="logout">🚪 Cerrar sesión</a>

    </nav>

    {% endif %}

</header>

<main>

    {% block content %}
    {% endblock %}

</main>

<footer>
    Fitness App © 2026
</footer>

</body>
</html>
