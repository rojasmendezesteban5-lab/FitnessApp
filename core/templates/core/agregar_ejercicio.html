<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Agregar ejercicio - FitnessApp</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #222;
        }

        header {
            background: #111827;
            color: white;
            padding: 22px 40px;
            font-size: 24px;
            font-weight: bold;
        }

        main {
            max-width: 850px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 5px 20px rgba(0,0,0,.08);
        }

        h1 {
            margin-top: 0;
            color: #111827;
        }

        label {
            display: block;
            margin-top: 20px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 16px;
            font-family: Arial, sans-serif;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        button {
            margin-top: 25px;
            background: #2563eb;
            color: white;
            border: 0;
            padding: 14px 22px;
            border-radius: 9px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .volver {
            display: inline-block;
            margin-top: 20px;
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }

    </style>

</head>

<body>

<header>
    🏋️ FitnessApp
</header>

<main>

    <div class="card">

        <h1>➕ Agregar ejercicio</h1>

        <form method="post">

            {% csrf_token %}

            {% for campo in campos %}

                <label for="{{ campo.nombre }}">
                    {{ campo.label }}
                </label>

                {% if campo.nombre == "descripcion" or campo.nombre == "instrucciones" %}

                    <textarea
                        id="{{ campo.nombre }}"
                        name="{{ campo.nombre }}"
                        placeholder="{{ campo.label }}"
                    ></textarea>

                {% else %}

                    <input
                        type="text"
                        id="{{ campo.nombre }}"
                        name="{{ campo.nombre }}"
                        placeholder="{{ campo.label }}"
                    >

                {% endif %}

            {% endfor %}

            <button type="submit">
                💾 Guardar ejercicio
            </button>

        </form>

        <a
            href="/admin/ejercicios/"
            class="volver"
        >
            ← Volver a ejercicios
        </a>

    </div>

</main>

</body>

</html>
