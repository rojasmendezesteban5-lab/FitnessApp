<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Eliminar cliente - FITNESS</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
        }

        .contenedor {
            max-width: 650px;
            margin: 80px auto;
            padding: 20px;
        }

        .tarjeta {
            background: white;
            padding: 35px;
            border-radius: 18px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,.08);
        }

        .botones {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 25px;
        }

        button,
        a {
            border: none;
            border-radius: 10px;
            padding: 12px 18px;
            font-size: 16px;
            cursor: pointer;
            text-decoration: none;
        }

        .rojo {
            background: #dc2626;
            color: white;
        }

        .azul {
            background: #2563eb;
            color: white;
        }
    </style>
</head>

<body>

<div class="contenedor">

    <div class="tarjeta">

        <h1>🗑️ Eliminar cliente</h1>

        <p>
            ¿Seguro que deseas eliminar a
            <strong>{{ cliente.nombre }}</strong>?
        </p>

        <p>
            Esta acción eliminará también sus datos relacionados.
        </p>

        <form method="post" action="{% url 'eliminar_cliente' cliente.id %}">

            {% csrf_token %}

            <div class="botones">

                <button type="submit" class="rojo">
                    🗑️ Sí, eliminar
                </button>

                <a href="{% url 'cliente_detalle' cliente.id %}" class="azul">
                    ↩️ Cancelar
                </a>

            </div>

        </form>

    </div>

</div>

</body>
</html>
