<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
Quitar ejercicio - FITNESS
</title>

<style>

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f1f5f9;
}

.contenedor {
    max-width: 650px;
    margin: 70px auto;
    padding: 20px;
}

.tarjeta {
    background: white;
    padding: 35px;
    border-radius: 18px;
    box-shadow: 0 4px 15px rgba(0,0,0,.08);
}

.alerta {
    background: #fee2e2;
    color: #991b1b;
    padding: 18px;
    border-radius: 12px;
    margin: 20px 0;
}

button,
a {
    display: inline-block;
    padding: 12px 18px;
    border: 0;
    border-radius: 10px;
    color: white;
    text-decoration: none;
    font-weight: bold;
    cursor: pointer;
}

.rojo {
    background: #dc2626;
}

.gris {
    background: #475569;
}

.botones {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

</style>

</head>


<body>

<div class="contenedor">

<div class="tarjeta">

<h1>
🗑️ Quitar ejercicio
</h1>

<p>
Rutina:
<strong>{{ rutina.nombre }}</strong>
</p>

<p>
Ejercicio:
<strong>{{ item.ejercicio.nombre }}</strong>
</p>


<div class="alerta">

⚠️ Esto quitará el ejercicio de esta rutina.

<br><br>

<strong>
El ejercicio NO será eliminado de la biblioteca de ejercicios.
</strong>

</div>


<form method="post">

{% csrf_token %}


<div class="botones">

<button
type="submit"
class="rojo"
>
🗑️ Sí, quitar de la rutina
</button>

<a
href="{% url 'gestionar_ejercicios_rutina' rutina.id %}"
class="gris"
>
↩️ Cancelar
</a>

</div>

</form>

</div>

</div>

</body>

</html>
